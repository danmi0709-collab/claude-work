<title>하리가 한 말</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 한 손으로 쓰는 세로 한 줄. 말풍선 모양 입력칸(아이 손글씨체) + 상황 + 사진 + 하단 고정 저장 버튼. 아래엔 노션 최근 기록 */
:root{
  --bg:#f2f4f7; --paper:#ffffff; --ink:#1d2433; --muted:#667085; --line:#dde2ea;
  --bubble:#fff4cc; --bubble-ink:#5b4300; --accent:#2f5bd3;
  --btn:#1d2433; --btn-ink:#ffffff; --ok:#21875a; --err:#b3261e; --warn:#9a5b00;
  --f-voice:"Gaegu","Gowun Dodum",cursive;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --paper:#1b2130; --ink:#e6eaf2; --muted:#9aa4b8; --line:#2b3346;
  --bubble:#3a3112; --bubble-ink:#ffe08a; --accent:#8fb0ff;
  --btn:#e6eaf2; --btn-ink:#12161f; --ok:#6fd3a0; --err:#ff8a80; --warn:#f2b55c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --paper:#1b2130; --ink:#e6eaf2; --muted:#9aa4b8; --line:#2b3346;
  --bubble:#3a3112; --bubble-ink:#ffe08a; --accent:#8fb0ff;
  --btn:#e6eaf2; --btn-ink:#12161f; --ok:#6fd3a0; --err:#ff8a80; --warn:#f2b55c; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 130px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--f-voice);font-weight:700;font-size:2.1rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.when{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.when input{font:inherit;font-size:.95rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-variant-numeric:tabular-nums}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.tag{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bubble{position:relative;background:var(--bubble);border-radius:20px;padding:4px 4px 2px}
.bubble::after{content:"";position:absolute;left:28px;bottom:-12px;border:12px solid transparent;border-top-color:var(--bubble);border-bottom:0}
.bubble label{display:block;font-size:.8rem;color:var(--bubble-ink);padding:10px 14px 0}
#quote{display:block;width:100%;box-sizing:border-box;border:0;background:transparent;color:var(--bubble-ink);font-family:var(--f-voice);font-size:1.5rem;line-height:1.4;padding:4px 14px 12px;min-height:110px;resize:vertical}
#quote::placeholder{color:var(--bubble-ink);opacity:.45}
.field{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.field label{font-size:.85rem;color:var(--muted)}
#ctx{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px;resize:vertical;box-sizing:border-box;width:100%}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.photos{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);cursor:pointer;background:var(--paper)}
.pick:focus-within{outline:2px solid var(--accent)}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumbs:empty{display:none}
.th{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:26px;padding:0;cursor:pointer}
section.recent{display:flex;flex-direction:column;gap:10px;margin-top:8px}
section.recent h2{font-size:1rem;margin:0;color:var(--muted);font-weight:400}
.entry{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.entry .t{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.entry .q{font-family:var(--f-voice);font-size:1.3rem;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.entry .c{font-size:.85rem;color:var(--muted);white-space:pre-line}
.entry .p{font-size:.8rem;color:var(--accent)}
.kept{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kept figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.kept img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--line)}
.kept figcaption{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
#save{width:100%;border:0;border-radius:12px;padding:14px;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
#save:disabled{opacity:.45;cursor:default}
#save:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#status{font-size:.88rem;min-height:1.3em;text-align:center;color:var(--muted)}
#status.ok{color:var(--ok)} #status.err{color:var(--err)} #status.warn{color:var(--warn)}
</style>

<div class="wrap">
  <header>
    <h1>하리가 한 말</h1>
    <p class="sub">쓰고 저장하면 노션 「하리가 한 말」 페이지 맨 아래에 쌓여요.</p>
  </header>

  <div class="when">
    <input type="date" id="date" aria-label="날짜">
    <input type="time" id="time" aria-label="시간">
    <button class="chip" id="now" type="button">지금으로</button>
    <span class="tag" id="tag"></span>
  </div>

  <div class="bubble">
    <label for="quote">하리가 한 말</label>
    <textarea id="quote" placeholder="엄마, 구름이 나를 따라와!"></textarea>
  </div>

  <div class="field">
    <label for="ctx">어떤 상황이었나요? (안 써도 돼요)</label>
    <textarea id="ctx" placeholder="놀이터 가는 길, 하늘 보다가"></textarea>
  </div>

  <div class="photos">
    <label class="pick">📷 사진 추가 (최대 4장)
      <input type="file" id="file" accept="image/*" multiple>
    </label>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <section class="recent" aria-labelledby="rh">
    <h2 id="rh">노션에 쌓인 최근 말</h2>
    <div id="recent"><p class="empty">claude.ai에서 열면 노션 기록이 보여요.</p></div>
  </section>

  <section class="recent" id="keptSec" hidden aria-labelledby="kh">
    <h2 id="kh">앱에 보관한 사진 (노션으로 못 간 사진)</h2>
    <div class="kept" id="kept"></div>
  </section>
</div>

<div class="bar"><div class="bar-in">
  <button id="save" type="button">노션에 저장</button>
  <div id="status" role="status" aria-live="polite"></div>
</div></div>

<script>
(function(){
  var PAGE_ID = "40e7777c03e9813dbc52e20141216d90";
  var SERVER = "Notion";
  var DAYS = ["일","월","화","수","목","금","토"];
  var MAX_PHOTOS = 4;
  var $ = function(id){return document.getElementById(id)};
  var mcp = null, assets = null, db = null, busy = false, directBlocked = false;
  var photos = []; // {blob, url}

  // ---------- 날짜·시간 ----------
  function pad(n){return (n<10?"0":"")+n}
  function setNow(){
    var d=new Date();
    $("date").value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    $("time").value=pad(d.getHours())+":"+pad(d.getMinutes());
    showTag();
  }
  function curTag(){
    var iso=$("date").value, tm=$("time").value||"";
    if(!iso) return "";
    var p=iso.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
    return "@"+p[0]+p[1]+p[2]+DAYS[d.getDay()]+(tm?" "+tm:"");
  }
  function showTag(){$("tag").textContent=curTag()}
  $("date").addEventListener("change",showTag);
  $("time").addEventListener("change",showTag);
  $("now").addEventListener("click",setNow);
  setNow();

  // ---------- 임시 저장(글만) ----------
  function loadDraft(){try{var d=JSON.parse(localStorage.getItem("hari-draft")||"{}");if(d.q)$("quote").value=d.q;if(d.c)$("ctx").value=d.c}catch(e){}}
  function saveDraft(){try{localStorage.setItem("hari-draft",JSON.stringify({q:$("quote").value,c:$("ctx").value}))}catch(e){}}
  function clearDraft(){try{localStorage.removeItem("hari-draft")}catch(e){}}
  loadDraft();
  $("quote").addEventListener("input",saveDraft);
  $("ctx").addEventListener("input",saveDraft);

  function status(msg,kind){var el=$("status");el.textContent=msg||"";el.className=kind||""}

  // ---------- 사진 고르기 (작게 줄여서 JPG로) ----------
  function shrink(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){
        var max=1600, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,max/Math.max(w,h));
        var c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){b?res(b):rej(new Error("변환 실패"))},"image/jpeg",0.85);
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("이 사진 형식은 열 수 없어요"))};
      img.src=url;
    });
  }
  function renderThumbs(){
    var box=$("thumbs"); box.textContent="";
    photos.forEach(function(p,i){
      var d=document.createElement("div"); d.className="th";
      var im=document.createElement("img"); im.src=p.url; im.alt="고른 사진 "+(i+1);
      var x=document.createElement("button"); x.type="button"; x.textContent="×"; x.setAttribute("aria-label","사진 "+(i+1)+" 빼기");
      x.addEventListener("click",function(){URL.revokeObjectURL(p.url);photos.splice(i,1);renderThumbs()});
      d.appendChild(im); d.appendChild(x); box.appendChild(d);
    });
  }
  $("file").addEventListener("change",function(e){
    var files=[].slice.call(e.target.files||[]); e.target.value="";
    var room=MAX_PHOTOS-photos.length;
    if(files.length>room) status("사진은 "+MAX_PHOTOS+"장까지예요. 앞의 "+room+"장만 넣었어요.","warn");
    files.slice(0,Math.max(0,room)).reduce(function(pr,f){
      return pr.then(function(){return shrink(f).then(function(b){photos.push({blob:b,url:URL.createObjectURL(b)});renderThumbs()})})
        .catch(function(err){status(err.message,"err")});
    },Promise.resolve());
  });

  // ---------- 노션 글 만들기 ----------
  function esc(t){
    return t.replace(/\\/g,"\\\\").replace(/([*_`~$\[\]])/g,"\\$1").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .trim().split(/\n/).map(function(l){return l.trim()}).filter(Boolean).join("<br />");
  }
  function buildBlock(tag,quote,ctx,imgMd,keptCount){
    var s='<p color="gray_bg">\n<b>'+tag+'</b><br />"'+esc(quote)+'"';
    if(ctx) s+='<br /><span color="gray">상황: '+esc(ctx)+'</span>';
    if(keptCount) s+='<br /><span color="gray">📷 사진 '+keptCount+'장은 「하리가 한 말」 앱에 보관</span>';
    s+='\n</p>';
    imgMd.forEach(function(m){s+="\n\n"+m});
    return s;
  }
  function payloadOf(r){
    var p=r&&r.payload;
    if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}
    return p||{};
  }
  function mdFrom(o){
    if(!o||typeof o!=="object") return null;
    if(o.markdown_source) return "![]("+o.markdown_source+")";
    if(typeof o.suggested_markdown==="string" && /^(!\[|<image)/.test(o.suggested_markdown.trim())) return o.suggested_markdown.trim();
    return null;
  }

  // 사진을 노션으로 바로 올리기
  function uploadToNotion(blob,name){
    var up;
    return mcp.callTool(SERVER,"notion-create-file-upload",{filename:name,content_type:"image/jpeg"},{cache:false}).then(function(r){
      up=payloadOf(r);
      if(!up.upload_url) throw {code:"local",message:"노션 업로드 주소를 못 받았어요"};
      var fd=new FormData(); fd.append(up.upload_form_field||"file",blob,name);
      return fetch(up.upload_url,{method:up.upload_method||"POST",headers:up.upload_headers||{},body:fd})
        .catch(function(e){directBlocked=true;throw {code:"blocked",message:"이 화면에서 노션으로 사진을 바로 보낼 수 없어요"}});
    }).then(function(res){
      if(!res.ok) throw {code:"blocked",message:"노션이 사진을 거절했어요 ("+res.status+")"};
      return res.json().catch(function(){return null});
    }).then(function(j){
      var md=mdFrom(j);
      if(md) return md;
      return mcp.callTool(SERVER,"notion-create-attachment",{source_file_id:up.file_upload_id},{cache:false})
        .then(function(r){var m=mdFrom(payloadOf(r)); if(!m) throw {code:"local",message:"사진 위치를 노션에서 못 받았어요"}; return m});
    });
  }
  // 노션으로 못 가면 앱에 보관
  function keepInApp(blob,tag,quote){
    if(!assets||!db) return Promise.reject({code:"local",message:"앱 보관함도 쓸 수 없어요"});
    return assets.upload(blob,{type:"image/jpeg"}).then(function(a){
      return db.collection("photos").add({assetId:a.id,tag:tag,quote:quote.slice(0,200),createdAt:Date.now()});
    });
  }

  // ---------- 최근 기록 ----------
  function pageText(result){
    var p=result&&result.payload, t=typeof p==="string"?p:(p&&typeof p.text==="string"?p.text:"");
    if(!t&&result&&result.content){result.content.forEach(function(c){if(c.type==="text")t+=c.text})}
    var m=t.match(/<content>([\s\S]*)<\/content>/); return m?m[1]:t;
  }
  function plain(s){
    return s.replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"").replace(/\\([\\*_`~$\[\]])/g,"$1")
      .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").trim();
  }
  function parseEntries(content){
    var out=[], re=/<p color="gray_bg">\n<b>(@[^<]+)<\/b>([\s\S]*?)\n<\/p>((?:\s*\n(?:!\[[^\]]*\]\([^)\n]*\)|<image[^>]*>[^\n]*?<\/image>|<image[^>]*\/>))*)/g, m;
    while((m=re.exec(content))){
      var parts=m[2].split(/<br \/>(?=<span color="gray">)/), q=plain(parts[0]), info=[];
      parts.slice(1).forEach(function(x){info.push(plain(x))});
      var imgs=(m[3].match(/!\[|<image/g)||[]).length;
      out.push({tag:m[1],quote:q,info:info,imgs:imgs});
    }
    return out;
  }
  function showRecent(content){
    var list=parseEntries(content).slice(-5).reverse(), box=$("recent"); box.textContent="";
    if(!list.length){var e=document.createElement("p");e.className="empty";e.textContent="아직 저장된 말이 없어요. 위에 첫 마디를 적어 보세요.";box.appendChild(e);return}
    list.forEach(function(it){
      var d=document.createElement("div"); d.className="entry";
      var t=document.createElement("div"); t.className="t"; t.textContent=it.tag.replace(/^@/,"");
      var q=document.createElement("div"); q.className="q"; q.textContent=it.quote;
      d.appendChild(t); d.appendChild(q);
      if(it.info.length){var c=document.createElement("div");c.className="c";c.textContent=it.info.join("\n");d.appendChild(c)}
      if(it.imgs){var p=document.createElement("div");p.className="p";p.textContent="사진 "+it.imgs+"장";d.appendChild(p)}
      $("recent").appendChild(d);
    });
  }
  function fetchPage(){return mcp.callTool(SERVER,"notion-fetch",{id:PAGE_ID},{cache:false}).then(pageText)}
  function setRecentMsg(msg){var b=$("recent");b.textContent="";var p=document.createElement("p");p.className="empty";p.textContent=msg;b.appendChild(p)}

  function errMsg(e){
    var c=e&&e.code;
    if(c==="local"||c==="blocked") return e.message;
    if(c==="server_not_connected") return "claude.ai 설정 → 커넥터에서 Notion을 연결해 주세요.";
    if(c==="needs_reauth") return "Notion 연결이 끊겼어요. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.";
    if(c==="selection_required") return "Notion 연결이 여러 개예요. 화면에 뜨는 선택창에서 하나를 골라 주세요.";
    if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required") return "이 앱이 노션을 쓰도록 허용해 주세요. 위쪽 권한 메뉴에서 바꿀 수 있어요.";
    if(c==="blocked_by_policy") return "조직 설정 때문에 노션 사용이 막혀 있어요.";
    if(c==="tool_error") return "노션이 거절했어요: "+String(e.message||"").slice(0,120);
    if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed") return "이 화면에서는 노션 연결을 쓸 수 없어요. claude.ai에서 열어 주세요.";
    return "노션 연결이 잠깐 불안정해요. 잠시 뒤 다시 눌러 주세요.";
  }

  // ---------- 저장 ----------
  function save(){
    if(busy) return;
    if(!mcp){status("이 화면에서는 노션 연결을 쓸 수 없어요. claude.ai에서 열어 주세요.","err");return}
    var quote=$("quote").value.trim(), ctx=$("ctx").value.trim(), tag=curTag();
    if(!quote){status("하리가 한 말을 먼저 적어 주세요.","err");$("quote").focus();return}
    if(!tag){status("날짜를 골라 주세요.","err");return}
    busy=true; $("save").disabled=true;
    var imgMd=[], kept=0, failed=0, stamp=tag.replace(/[@: ]/g,"");
    var chain=Promise.resolve();
    photos.forEach(function(p,i){
      chain=chain.then(function(){
        status("사진 "+(i+1)+"/"+photos.length+" 올리는 중…");
        var name="hari_"+stamp+"_"+(i+1)+".jpg";
        var tryNotion=directBlocked?Promise.reject({code:"blocked"}):uploadToNotion(p.blob,name);
        return tryNotion.then(function(md){imgMd.push(md)}).catch(function(){
          return keepInApp(p.blob,tag,quote).then(function(){kept++}).catch(function(){failed++});
        });
      });
    });
    var block;
    chain.then(function(){
      if(failed && !imgMd.length && !kept) throw {code:"local",message:"사진을 올리지 못했어요. 사진을 빼고 저장하거나 잠시 뒤 다시 눌러 주세요."};
      block=buildBlock(tag,quote,ctx,imgMd,kept);
      status("노션에 쓰는 중…");
      return mcp.callTool(SERVER,"notion-update-page",{page_id:PAGE_ID,command:"insert_content",content:block,position:{type:"end"},allow_async:false},{cache:false});
    }).then(function(){
      done();
    }).catch(function(e){
      if(block && e && (e.code==="server_unavailable"||e.code==="upstream_error")){
        status("저장됐는지 확인 중…");
        return fetchPage().then(function(c){
          if(c.indexOf("<b>"+tag+"</b>")>-1 && c.indexOf(esc(quote).slice(0,20))>-1) done();
          else status(errMsg(e)+" 쓴 내용은 그대로 남아 있어요.","err");
        }).catch(function(){status(errMsg(e)+" 노션에서 직접 한 번 확인해 주세요.","err")});
      }
      status(errMsg(e)+" 쓴 내용은 그대로 남아 있어요.","err");
    }).then(function(){busy=false;$("save").disabled=false});

    function done(){
      var n=photos.length;
      $("quote").value=""; $("ctx").value=""; clearDraft();
      photos.forEach(function(p){URL.revokeObjectURL(p.url)}); photos=[]; renderThumbs();
      var msg=tag+" 말을 노션에 저장했어요.";
      if(n) msg+=" 사진 "+imgMd.length+"장 노션"+(kept?", "+kept+"장 앱 보관":"")+(failed?", "+failed+"장 실패":"")+".";
      status(msg,(kept||failed)?"warn":"ok");
      setNow();
      fetchPage().then(showRecent).catch(function(){});
    }
  }
  $("save").addEventListener("click",save);

  // ---------- 앱 보관 사진 ----------
  function watchKept(){
    if(!db) return;
    db.collection("photos").orderBy("createdAt","desc").limit(30).onSnapshot(function(snap){
      var box=$("kept"); box.textContent="";
      $("keptSec").hidden=snap.empty;
      snap.docs.forEach(function(d){
        var v=d.data()||{}; if(typeof v.assetId!=="string") return;
        var f=document.createElement("figure"), im=document.createElement("img"), cap=document.createElement("figcaption");
        im.src="/_blob/"+v.assetId; im.alt=String(v.quote||"하리 사진"); im.loading="lazy";
        cap.textContent=String(v.tag||"").replace(/^@/,"");
        f.appendChild(im); f.appendChild(cap); box.appendChild(f);
      });
    },function(){});
  }

  // ---------- 시작 ----------
  if(!(window.claude&&window.claude.use)) return;
  window.claude.use("assets").then(function(a){assets=a}).catch(function(){});
  window.claude.use("db").then(function(d){db=d;watchKept()}).catch(function(){});
  window.claude.use("mcp").then(function(m){
    mcp=m;
    if(!mcp){setRecentMsg("이 화면에서는 노션 연결을 쓸 수 없어요.");return}
    setRecentMsg("노션에서 최근 기록을 불러오는 중…");
    fetchPage().then(showRecent).catch(function(e){setRecentMsg(errMsg(e))});
  });
})();
</script>

<title>하리 작품 앨범</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 스케치북 느낌: 크림색 종이 + 크레용 색 종류 칩. 사진이 주인공이라 바탕은 조용하게 */
:root{
  --bg:#fbf6ee; --paper:#ffffff; --ink:#2b2622; --muted:#7a6f66; --line:#eadfd1;
  --accent:#e2574c; --accent-ink:#ffffff; --danger:#c0392b; --shade:rgba(0,0,0,.45);
  --f-display:"Jua","Gowun Dodum",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1916; --paper:#26221e; --ink:#f1ebe4; --muted:#a99d92; --line:#3a332d;
  --accent:#ff7a6e; --accent-ink:#1c1916; --danger:#ff8a80; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1916; --paper:#26221e; --ink:#f1ebe4; --muted:#a99d92; --line:#3a332d;
  --accent:#ff7a6e; --accent-ink:#1c1916; --danger:#ff8a80; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
.wrap{max-width:720px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}
.count{color:var(--muted);font-size:.9rem;margin-top:4px}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:.9rem;flex:none}
.tabs{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-family:var(--f-display);font-size:1.05rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ink));background:var(--c,var(--ink));color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.month{font-family:var(--f-display);font-size:1.35rem;margin:22px 0 4px}
.day{display:flex;align-items:baseline;gap:8px;color:var(--muted);font-size:.9rem;margin:12px 0 6px}
.day b{color:var(--ink);font-weight:400;font-size:1rem}
.age{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:.8rem;color:var(--ink)}
.hint{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.agenote{font-size:.85rem;color:var(--accent);margin-top:5px;min-height:1.2em}
.kindhead{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-family:var(--f-display);font-size:1.3rem}
.kindhead .n{font-family:var(--f-body);font-size:.85rem;color:var(--muted)}
.kindhead .bar{flex:1;height:3px;border-radius:2px;background:var(--c);opacity:.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--line)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .k{position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #fff}
.tile .d{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;font-size:.72rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.empty .big{font-family:var(--f-display);font-size:1.4rem;color:var(--ink);margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;
  border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:1.25rem;
  padding:15px 30px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap}
.fab:disabled{opacity:.5}
/* 아래에서 올라오는 시트 */
.sheet-bg{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:1.4rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.preview{width:100%;max-height:40vh;object-fit:contain;border-radius:12px;background:var(--paper);display:block;margin-bottom:8px}
.pageinfo{text-align:center;font-size:.85rem;color:var(--muted);min-height:1.2em;margin-bottom:4px}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.tools button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:.92rem}
.tools button:disabled{opacity:.5}
.pages{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding:2px}
.pages button{flex:none;width:64px;height:64px;border-radius:8px;overflow:hidden;border:3px solid transparent;padding:0;background:var(--line);position:relative}
.pages button[aria-current="true"]{border-color:var(--accent)}
.pages img{width:100%;height:100%;object-fit:cover;display:block}
.pages .no{position:absolute;left:2px;top:2px;font-size:.68rem;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px}
.addrow{margin-bottom:4px}
.tile .cnt{position:absolute;right:5px;top:5px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;border-radius:6px;padding:1px 6px}
.vstrip{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.vstrip button{flex:none;width:48px;height:48px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:#333}
.vstrip button[aria-current="true"]{border-color:#fff}
.vstrip img{width:100%;height:100%;object-fit:cover;display:block}
/* 자르기 화면 */
.crop{position:fixed;inset:0;z-index:60;background:#111;display:flex;flex-direction:column;color:#fff}
.crop .top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
.crop .top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:9px 14px}
.crop .top .done{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:1.05rem}
.crop .stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;padding:28px;user-select:none;-webkit-user-select:none}
.crop .stage img{max-width:100%;max-height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.cbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}
.cbox .h{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;border:3px solid var(--accent);touch-action:none}
.chint{margin:0;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));font-size:.85rem;color:#ccc;text-align:center}
.field{margin-bottom:12px}
.field>label,.field>.lab{display:block;font-size:.88rem;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px}
.field textarea{min-height:64px;resize:vertical}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds .chip{font-size:1rem;padding:7px 14px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.primary{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:14px;font-family:var(--f-display);font-size:1.15rem;width:100%}
.primary:disabled{opacity:.5}
.ghost{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px}
.danger-btn{border:0;border-radius:12px;background:var(--danger);color:#fff;padding:12px}
.x{border:0;background:none;font-size:1.6rem;line-height:1;padding:4px 8px;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:4px 0 14px}
/* 크게 보기 */
.viewer{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;color:#fff}
.viewer .top{display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
.viewer .top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px}
.viewer .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y}
.viewer .pic img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.16);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.4rem}
.viewer .prev{left:8px}.viewer .next{right:8px}
.viewer .info{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#111}
.viewer .info .t{font-family:var(--f-display);font-size:1.3rem}
.viewer .info .m{color:#ccc;font-size:.9rem;margin-top:2px}
.viewer .info .memo{margin-top:6px;white-space:pre-wrap}
.menu .ghost{display:block;width:100%;text-align:left;margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;z-index:50;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>하리 작품 앨범</h1>
      <div class="count" id="count">불러오는 중…</div>
    </div>
    <button class="icon-btn" id="menuBtn" type="button">⚙︎ 설정</button>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabDate" type="button" aria-selected="true">날짜별</button>
    <button role="tab" id="tabKind" type="button" aria-selected="false">종류별</button>
  </div>
  <button class="hint" id="birthHint" type="button" hidden>🎂 하리 생일을 넣으면 작품마다 그때 나이가 보여요 →</button>
  <div class="chips" id="filter"></div>
  <main id="list"></main>
</div>

<button class="fab" id="shoot" type="button" hidden>📷 작품 찍기</button>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="gallery" accept="image/*" multiple hidden>
<input type="file" id="addCam" accept="image/*" capture="environment" hidden>
<input type="file" id="addGal" accept="image/*" multiple hidden>

<!-- 저장/수정 시트 -->
<div class="sheet-bg" id="editBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <h2><span id="editTitle">작품 저장</span><button class="x" id="editClose" type="button" aria-label="닫기">×</button></h2>
    <img class="preview" id="editPreview" alt="">
    <div class="pageinfo" id="pageInfo"></div>
    <div class="tools" id="editTools">
      <button id="editRotate" type="button">↻ 돌리기</button>
      <button id="editCrop" type="button">✂️ 자르기</button>
      <button id="editCover" type="button">표지로</button>
      <button id="editDrop" type="button">이 사진 빼기</button>
    </div>
    <div class="pages" id="editPages"></div>
    <div class="row addrow"><button class="ghost" id="addShot" type="button">📷 한 장 더 찍기</button><button class="ghost" id="addPick" type="button">🖼️ 앨범에서 더하기</button></div>
    <p class="note">앞면·뒷면·옆면처럼 한 작품에 사진을 여러 장 넣을 수 있어요. 첫 사진이 표지예요.</p>
    <div class="field"><span class="lab">어떤 작품이에요?</span><div class="kinds" id="editKinds"></div></div>
    <div class="field"><label for="editName">제목 (안 써도 돼요)</label><input id="editName" placeholder="예: 우리 가족, 공룡 친구"></div>
    <div class="field"><label for="editDate">만든 날</label><input type="date" id="editDate"><div class="agenote" id="editAge"></div></div>
    <div class="field"><label for="editMemo">하리가 한 말 / 메모</label><textarea id="editMemo" placeholder="예: 엄마가 웃는 모습이래요"></textarea></div>
    <button class="primary" id="editSave" type="button">저장하기</button>
    <div id="editMore" class="note"></div>
  </div>
</div>

<!-- 메뉴 시트 -->
<div class="sheet-bg" id="menuBg" hidden>
  <div class="sheet menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <h2><span id="menuTitle">설정</span><button class="x" id="menuClose" type="button" aria-label="닫기">×</button></h2>
    <div class="field" id="birthField"><label for="birth">🎂 하리 생일</label>
      <div class="row"><input type="date" id="birth"><button class="ghost" id="saveBirth" type="button" style="flex:none">저장</button></div></div>
    <button class="ghost" id="pickGallery" type="button">🖼️ 앨범에서 사진 여러 장 가져오기</button>
    <p class="note">앨범에서 가져오면 사진 파일의 날짜가 '만든 날'로 자동으로 들어가요.</p>
    <div class="field"><label for="newKind">작품 종류 추가 (예: 점토, 블록)</label>
      <div class="row"><input id="newKind" maxlength="12"><button class="ghost" id="addKind" type="button" style="flex:none">추가</button></div></div>
    <p class="note" id="kindList"></p>
    <p class="note" id="usage"></p>
  </div>
</div>

<!-- 지우기 확인 -->
<div class="sheet-bg" id="askBg" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="askText">
    <h2 id="askText">이 작품을 지울까요?</h2>
    <p class="note">지우면 되돌릴 수 없어요.</p>
    <div class="row"><button class="ghost" id="askNo" type="button">그대로 두기</button><button class="danger-btn" id="askYes" type="button">지우기</button></div>
  </div>
</div>

<!-- 자르기 -->
<div class="crop" id="crop" role="dialog" aria-modal="true" aria-label="사진 자르기" hidden>
  <div class="top"><button id="cCancel" type="button">취소</button><button id="cReset" type="button">전체 선택</button><button id="cDone" type="button" class="done">자르기 완료</button></div>
  <div class="stage" id="cStage"><img id="cImg" alt=""><div class="cbox" id="cBox">
    <i class="h" data-h="nw" style="left:0;top:0"></i><i class="h" data-h="n" style="left:50%;top:0"></i><i class="h" data-h="ne" style="left:100%;top:0"></i>
    <i class="h" data-h="e" style="left:100%;top:50%"></i><i class="h" data-h="se" style="left:100%;top:100%"></i><i class="h" data-h="s" style="left:50%;top:100%"></i>
    <i class="h" data-h="sw" style="left:0;top:100%"></i><i class="h" data-h="w" style="left:0;top:50%"></i></div></div>
  <p class="chint">동그라미를 끌어 크기를 바꾸고, 네모 안을 끌면 옮겨져요. 바깥을 끌면 새로 그려요.</p>
</div>

<!-- 크게 보기 -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" hidden>
  <div class="top">
    <button id="vClose" type="button">← 닫기</button>
    <div style="display:flex;gap:6px" id="vTools"><button id="vRot" type="button" aria-label="사진 돌리기">↻ 돌리기</button><button id="vEdit" type="button">수정</button><button id="vDel" type="button">삭제</button></div>
  </div>
  <div class="pic" id="vPic">
    <img id="vImg" alt="">
    <button class="nav prev" id="vPrev" type="button" aria-label="이전">‹</button>
    <button class="nav next" id="vNext" type="button" aria-label="다음">›</button>
  </div>
  <div class="info"><div class="t" id="vTitle"></div><div class="m" id="vMeta"></div><div class="memo" id="vMemo"></div><div class="vstrip" id="vStrip"></div></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const DEFAULT_KINDS = [
  {id:'draw', name:'그림', color:'#e2574c'},
  {id:'color', name:'색칠', color:'#f2a23a'},
  {id:'craft', name:'만들기', color:'#3a9d5d'},
  {id:'fold', name:'종이접기', color:'#3f7fd6'},
  {id:'write', name:'글씨·편지', color:'#8e5bc9'},
  {id:'etc', name:'기타', color:'#8a7f75'},
];
const EXTRA_COLORS = ['#d6457f','#1fa3a3','#b07a2a','#5b6bd6','#6aa13a','#c25b2e'];

/* 저장 위치: 기록은 db, 사진 파일은 assets (둘 다 claude.ai 쪽에 보관돼서 폰을 바꿔도 남음) */
let db = null, assets = null;
let works = [];        // {id, kind, name, date, memo, imgId, thumbId, created}
let kinds = DEFAULT_KINDS.slice();
let view = 'date', filterKind = null, shown = [];
let canWrite = false;

const blobUrl = id => '/_blob/' + id;
const kindOf = id => kinds.find(k => k.id === id) || {id, name:'기타', color:'#8a7f75'};
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const today = () => ymd(new Date());
const WD = ['일','월','화','수','목','금','토'];
function dayLabel(s){ const [y,m,d]=s.split('-').map(Number); return `${m}월 ${d}일 (${WD[new Date(y,m-1,d).getDay()]})`; }
/* 만 나이: 작품 날짜 기준 '6살 3개월'. 돌 전이면 '8개월' */
let birth = '';
function ageLabel(s){
  if (!birth || !s) return '';
  const [by,bm,bd]=birth.split('-').map(Number), [y,m,d]=s.split('-').map(Number);
  let yy=y-by, mm=m-bm; if (d<bd) mm--; if (mm<0){ yy--; mm+=12; }
  if (yy<0) return '';
  return yy ? `${yy}살${mm?' '+mm+'개월':''}` : `${mm}개월`;
}
function monthLabel(s){ const [y,m]=s.split('-'); return `${y}년 ${Number(m)}월`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms||2400); }
function memo(key, val){ try{ if(val===undefined) return localStorage.getItem(key); localStorage.setItem(key,val); }catch(e){ return null; } }
function errMsg(e){
  const c = e && e.code;
  if (c==='quota_or_state' || c==='quota_exceeded') return '저장 공간이 가득 찼어요. 오래된 작품을 몇 개 지운 뒤 다시 해주세요.';
  if (c==='not_granted') return '저장 권한을 허용해야 해요. 다시 눌러서 허용해주세요.';
  if (c==='rate_limited' || c==='resource_exhausted') return '잠깐 너무 빨랐어요. 몇 초 뒤 다시 해주세요.';
  return '저장하지 못했어요. 인터넷 연결을 확인하고 다시 해주세요.';
}

/* ---------- 사진 줄이기: 원본은 너무 커서 보기 좋은 크기로 ---------- */
async function loadBitmap(file){
  if ('createImageBitmap' in window){ try { return await createImageBitmap(file, {imageOrientation:'from-image'}); } catch(e){} }
  return new Promise((res, rej) => { const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
}
function shrink(bmp, max, q){
  const w=bmp.width, h=bmp.height, r=Math.min(1, max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*r); c.height=Math.round(h*r);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', q));
}
/* 사진을 시계 방향 90도로 돌림. src는 Blob 또는 주소 */
function loadImg(src){ return new Promise((res, rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src = typeof src==='string' ? src : URL.createObjectURL(src); }); }
async function rotateBlob(src){
  const im=await loadImg(src); const w=im.naturalWidth, h=im.naturalHeight;
  const c=document.createElement('canvas'); c.width=h; c.height=w;
  const g=c.getContext('2d'); g.translate(h,0); g.rotate(Math.PI/2); g.drawImage(im,0,0);
  if (typeof src!=='string') URL.revokeObjectURL(im.src);
  return new Promise(res=>c.toBlob(res,'image/jpeg',.85));
}
async function processFile(file){
  const bmp = await loadBitmap(file);
  const img = await shrink(bmp, 1600, .82), thumb = await shrink(bmp, 420, .75);
  if (bmp.close) bmp.close();
  return {img, thumb};
}

/* ---------- 화면 그리기 ---------- */
function render(){
  const total = works.length;
  $('count').textContent = total ? `작품 ${total}개 · ${new Set(works.map(w=>w.date)).size}일 동안` : '';
  $('tabDate').setAttribute('aria-selected', view==='date');
  $('tabKind').setAttribute('aria-selected', view==='kind');
  $('birthHint').hidden = !!birth || !canWrite || !total;

  const f=$('filter'); f.innerHTML=''; f.hidden = view!=='date' || !total;
  if (view==='date'){
    const all=chip('전체', null, filterKind===null); all.onclick=()=>{filterKind=null;render();}; f.appendChild(all);
    kinds.filter(k=>works.some(w=>w.kind===k.id)).forEach(k=>{
      const c=chip(k.name,k.color,filterKind===k.id,true); c.onclick=()=>{filterKind=filterKind===k.id?null:k.id;render();}; f.appendChild(c); });
  }
  const list=$('list'); list.innerHTML=''; shown=[];
  if (!total){
    list.innerHTML = canWrite
      ? `<div class="empty"><div class="big">아직 작품이 없어요</div>아래 <b>📷 작품 찍기</b>를 눌러<br>하리의 첫 작품을 담아보세요.</div>`
      : `<div class="empty"><div class="big">아직 작품이 없어요</div></div>`;
    return;
  }
  const sorted = works.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.created-a.created);
  if (view==='date'){
    const items = filterKind ? sorted.filter(w=>w.kind===filterKind) : sorted;
    let m=null, d=null, grid=null;
    items.forEach(w=>{
      if (w.date.slice(0,7)!==m){ m=w.date.slice(0,7); d=null; add(list,'div','month',monthLabel(w.date)); }
      if (w.date!==d){ d=w.date; const h=add(list,'div','day'); const ag=ageLabel(d); h.innerHTML=`<b>${dayLabel(d)}</b>${items.filter(x=>x.date===d).length}개${ag?` <span class="age">${ag}</span>`:''}`; grid=add(list,'div','grid'); }
      grid.appendChild(tile(w,false));
    });
  } else {
    const groups = kinds.map(k=>({k, items:sorted.filter(w=>w.kind===k.id)}));
    const orphan = sorted.filter(w=>!kinds.some(k=>k.id===w.kind));
    if (orphan.length) groups.push({k:{name:'분류 없음',color:'#8a7f75'}, items:orphan});
    groups.forEach(({k,items})=>{
      if (!items.length) return;
      const h=add(list,'div','kindhead'); h.style.setProperty('--c',k.color);
      h.innerHTML=`<span class="dot"></span>${esc(k.name)} <span class="n">${items.length}개</span><span class="bar"></span>`;
      const grid=add(list,'div','grid'); items.forEach(w=>grid.appendChild(tile(w,true)));
    });
  }
}
function add(parent, tag, cls, text){ const e=document.createElement(tag); e.className=cls; if(text) e.textContent=text; parent.appendChild(e); return e; }
function chip(text, color, pressed, dot){
  const b=document.createElement('button'); b.className='chip'; b.type='button';
  b.setAttribute('aria-pressed', pressed); if (color) b.style.setProperty('--c', color);
  b.innerHTML=(dot && !pressed ? '<span class="dot"></span>' : '')+esc(text); return b;
}
function tile(w, showDate){
  const k=kindOf(w.kind), idx=shown.push(w)-1;
  const b=document.createElement('button'); b.className='tile'; b.type='button'; b.style.setProperty('--c',k.color);
  b.setAttribute('aria-label', `${k.name} ${w.name||''} ${dayLabel(w.date)}`);
  const label = (w.name||'') + (showDate ? (w.name?' · ':'')+(ageLabel(w.date) || w.date.slice(2).replace(/-/g,'.')) : '');
  b.innerHTML=`<img loading="lazy" alt="" src="${blobUrl(w.thumbId)}"><span class="k"></span>${photosOf(w).length>1?`<span class="cnt">${photosOf(w).length}장</span>`:''}`+(label?`<span class="d">${esc(label)}</span>`:'');
  b.onclick=()=>openViewer(idx);
  return b;
}

/* ---------- 한 작품의 사진들: 예전 작품(사진 1장)도 같은 모양으로 ---------- */
function photosOf(w){ return (w.photos && w.photos.length) ? w.photos : [{imgId:w.imgId, thumbId:w.thumbId}]; }

/* ---------- 자르기 화면: 네모 모서리·변을 끌어 조절, 빈 곳을 끌면 새로 그리기 ---------- */
let crop=null;
function cropLayout(){
  if (!crop) return;
  const sr=$('cStage').getBoundingClientRect(), ir=$('cImg').getBoundingClientRect();
  crop.ox=ir.left-sr.left; crop.oy=ir.top-sr.top; crop.dw=ir.width; crop.dh=ir.height; cropDraw();
}
function cropDraw(){
  const b=crop.box, s=$('cBox').style;
  s.left=(crop.ox+b.x*crop.dw)+'px'; s.top=(crop.oy+b.y*crop.dh)+'px';
  s.width=(b.w*crop.dw)+'px'; s.height=(b.h*crop.dh)+'px';
}
function openCrop(src){
  return new Promise((resolve, reject)=>{
    const url = typeof src==='string' ? src : URL.createObjectURL(src);
    const im=$('cImg');
    im.onload=()=>{ $('crop').hidden=false; crop={resolve, url, own:typeof src!=='string', box:{x:.05,y:.05,w:.9,h:.9}}; requestAnimationFrame(cropLayout); };
    im.onerror=()=>reject(new Error('load'));
    im.src=url;
  });
}
function cropClose(result){
  const c=crop; crop=null; $('crop').hidden=true;
  if (c){ if (c.own) setTimeout(()=>URL.revokeObjectURL(c.url), 1000); c.resolve(result); }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let drag=null;
$('cStage').addEventListener('pointerdown', e=>{
  if (!crop) return; e.preventDefault();
  const h=e.target.dataset && e.target.dataset.h;
  const px=(e.clientX-$('cStage').getBoundingClientRect().left-crop.ox)/crop.dw;
  const py=(e.clientY-$('cStage').getBoundingClientRect().top-crop.oy)/crop.dh;
  const mode = h ? h : (e.target.id==='cBox' ? 'move' : 'draw');
  drag={mode, sx:e.clientX, sy:e.clientY, b:{...crop.box}, px:clamp(px,0,1), py:clamp(py,0,1)};
  $('cStage').setPointerCapture(e.pointerId);
});
$('cStage').addEventListener('pointermove', e=>{
  if (!drag || !crop) return;
  const dx=(e.clientX-drag.sx)/crop.dw, dy=(e.clientY-drag.sy)/crop.dh, b=drag.b;
  const mx=30/crop.dw, my=30/crop.dh;
  if (drag.mode==='move'){
    crop.box={...b, x:clamp(b.x+dx,0,1-b.w), y:clamp(b.y+dy,0,1-b.h)};
  } else if (drag.mode==='draw'){
    const x2=clamp(drag.px+dx,0,1), y2=clamp(drag.py+dy,0,1);
    crop.box={x:Math.min(drag.px,x2), y:Math.min(drag.py,y2), w:Math.max(Math.abs(x2-drag.px),mx), h:Math.max(Math.abs(y2-drag.py),my)};
    crop.box.x=Math.min(crop.box.x,1-crop.box.w); crop.box.y=Math.min(crop.box.y,1-crop.box.h);
  } else {
    let l=b.x, t=b.y, r=b.x+b.w, d=b.y+b.h; const m=drag.mode;
    if (m.includes('w')) l=clamp(l+dx,0,r-mx);
    if (m.includes('e')) r=clamp(r+dx,l+mx,1);
    if (m.includes('n')) t=clamp(t+dy,0,d-my);
    if (m.includes('s')) d=clamp(d+dy,t+my,1);
    crop.box={x:l, y:t, w:r-l, h:d-t};
  }
  cropDraw();
});
['pointerup','pointercancel'].forEach(ev=>$('cStage').addEventListener(ev, ()=>{ drag=null; }));
window.addEventListener('resize', cropLayout);
$('cCancel').onclick=()=>cropClose(null);
$('cReset').onclick=()=>{ if(crop){ crop.box={x:0,y:0,w:1,h:1}; cropDraw(); } };
$('cDone').onclick=()=>{
  if (!crop) return;
  const im=$('cImg'), iw=im.naturalWidth, ih=im.naturalHeight, b=crop.box;
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(b.w*iw)); c.height=Math.max(1,Math.round(b.h*ih));
  c.getContext('2d').drawImage(im, b.x*iw, b.y*ih, c.width, c.height, 0, 0, c.width, c.height);
  c.toBlob(blob=>cropClose(blob), 'image/jpeg', .85);
};

/* ---------- 저장/수정 시트 ---------- */
let queue=[], editing=null, previewUrl=null;
let lastKind = memo('hari-lastKind') || 'draw';
const pageSrc = p => p.blob || blobUrl(p.imgId);
function pageThumb(p){ if (p.blob){ if(!p.url) p.url=URL.createObjectURL(p.thumbBlob || p.blob); return p.url; } return blobUrl(p.thumbId); }
function openEdit(item, isNew, cur){
  const pages = isNew ? item.pages : photosOf(item).map(p=>({...p}));
  editing={item, isNew, kind:item.kind || lastKind, pages, cur:clamp(cur||0,0,pages.length-1), removed:[]};
  $('editTitle').textContent = isNew ? '작품 저장' : '작품 수정';
  $('editName').value=item.name||''; $('editDate').value=item.date||today(); $('editMemo').value=item.memo||''; showEditAge();
  $('editMore').textContent = queue.length ? `이 다음에 작품 ${queue.length}개가 더 있어요` : '';
  drawPages(); drawKinds(); $('editBg').hidden=false;
}
function drawPages(){
  const ps=editing.pages, p=ps[editing.cur];
  if (previewUrl){ URL.revokeObjectURL(previewUrl); previewUrl=null; }
  if (p.blob){ previewUrl=URL.createObjectURL(p.blob); $('editPreview').src=previewUrl; } else $('editPreview').src=blobUrl(p.imgId);
  const box=$('editPages'); box.innerHTML=''; box.hidden = ps.length<2;
  ps.forEach((q,i)=>{
    const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-current', i===editing.cur);
    b.setAttribute('aria-label', `${i+1}번째 사진`);
    b.innerHTML=`<img alt="" src="${pageThumb(q)}"><span class="no">${i===0?'표지':i+1}</span>`;
    b.onclick=()=>{ editing.cur=i; drawPages(); }; box.appendChild(b);
  });
  $('editDrop').hidden = ps.length<2; $('editCover').hidden = editing.cur===0;
  $('pageInfo').textContent = ps.length>1 ? `사진 ${editing.cur+1} / ${ps.length}` : '';
}
function drawKinds(){
  const box=$('editKinds'); box.innerHTML='';
  kinds.forEach(k=>{ const c=chip(k.name,k.color,editing.kind===k.id,true); c.onclick=()=>{editing.kind=k.id;drawKinds();}; box.appendChild(c); });
}
function closeEdit(){
  if (previewUrl){ URL.revokeObjectURL(previewUrl); previewUrl=null; }
  if (editing) editing.pages.forEach(p=>{ if(p.url) URL.revokeObjectURL(p.url); });
  $('editBg').hidden=true; editing=null;
}
/* 지금 보는 사진을 바꿈(돌리기·자르기). 예전에 올린 파일은 저장할 때 지움 */
async function changePage(fn){
  if (!editing) return;
  const tools=document.querySelectorAll('#editTools button'); tools.forEach(b=>b.disabled=true);
  try{
    const p=editing.pages[editing.cur];
    const blob=await fn(pageSrc(p)); if (!blob || !editing) return;
    if (p.imgId) editing.removed.push({imgId:p.imgId, thumbId:p.thumbId});
    if (p.url){ URL.revokeObjectURL(p.url); }
    editing.pages[editing.cur]={blob};
    drawPages();
  } catch(e){ toast('사진을 바꾸지 못했어요. 다시 해주세요.'); }
  finally{ tools.forEach(b=>b.disabled=false); }
}
const rotateEditing=()=>changePage(rotateBlob);
$('editRotate').onclick=rotateEditing;
$('editCrop').onclick=()=>changePage(openCrop);
$('editDrop').onclick=()=>{
  const ps=editing.pages; if (ps.length<2) return;
  const p=ps.splice(editing.cur,1)[0];
  if (p.imgId) editing.removed.push({imgId:p.imgId, thumbId:p.thumbId});
  if (p.url) URL.revokeObjectURL(p.url);
  editing.cur=Math.min(editing.cur, ps.length-1); drawPages();
};
$('editCover').onclick=()=>{ const ps=editing.pages; ps.unshift(ps.splice(editing.cur,1)[0]); editing.cur=0; drawPages(); toast('표지로 정했어요'); };
async function addPages(files){
  if (!editing) return;
  for (const f of Array.from(files)){
    try{ const {img, thumb}=await processFile(f); editing.pages.push({blob:img, thumbBlob:thumb}); editing.cur=editing.pages.length-1; drawPages(); }
    catch(e){ toast('사진을 읽지 못했어요.'); }
  }
}
$('addShot').onclick=()=>$('addCam').click();
$('addPick').onclick=()=>$('addGal').click();
$('addCam').onchange=e=>{ if(e.target.files.length) addPages(e.target.files); e.target.value=''; };
$('addGal').onchange=e=>{ if(e.target.files.length) addPages(e.target.files); e.target.value=''; };
function showEditAge(){ const a=ageLabel($('editDate').value); $('editAge').textContent = a ? `이날 하리는 ${a}` : ''; }
$('editDate').addEventListener('input', showEditAge);
$('editClose').onclick=()=>{ queue=[]; closeEdit(); };
async function makeThumb(blob){ const bm=await loadBitmap(blob); const t=await shrink(bm,420,.75); if(bm.close) bm.close(); return t; }
$('editSave').onclick=async()=>{
  if (!editing) return;
  const btn=$('editSave'); btn.disabled=true; btn.textContent='저장하는 중…';
  try{
    const fields={kind:editing.kind, name:$('editName').value.trim(), date:$('editDate').value||today(), memo:$('editMemo').value.trim()};
    const photos=[];
    for (const p of editing.pages){
      if (p.blob){
        if (!p.up){
          const im=await assets.upload(p.blob, {type:'image/jpeg'});
          const th=await assets.upload(p.thumbBlob || await makeThumb(p.blob), {type:'image/jpeg'});
          p.up={imgId:im.id, thumbId:th.id};   // 실패 후 다시 눌러도 두 번 올리지 않게
        }
        photos.push(p.up);
      } else photos.push({imgId:p.imgId, thumbId:p.thumbId});
    }
    Object.assign(fields, {photos, imgId:photos[0].imgId, thumbId:photos[0].thumbId});
    let savedId=null;
    if (editing.isNew){
      const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));
      const row={...fields, created:Date.now()};
      await db.collection('works').doc(id).set(row);
      upsert({id,...row}); toast('저장했어요');
    } else {
      const old=editing.item; savedId=old.id;
      await db.collection('works').doc(old.id).update(fields);
      editing.removed.forEach(r=>{ assets.delete(r.imgId).catch(()=>{}); assets.delete(r.thumbId).catch(()=>{}); });
      upsert({...old, ...fields}); toast('고쳤어요');
    }
    lastKind=fields.kind; memo('hari-lastKind', lastKind);
    const sub=editing.cur;
    closeEdit(); render();
    if (savedId && !$('viewer').hidden){ const j=shown.findIndex(x=>x.id===savedId); if (j>=0) showAt(j, sub); }
    nextInQueue();
  } catch(e){ toast(errMsg(e), 4000); }
  finally{ btn.disabled=false; btn.textContent='저장하기'; }
};
function upsert(w){ const i=works.findIndex(x=>x.id===w.id); if(i>=0) works[i]=w; else works.push(w); }
function takeFiles(files, fromAlbum){ queue=Array.from(files).map(f=>({f, fromAlbum})); nextInQueue(); }
async function nextInQueue(){
  const next=queue.shift(); if (!next) return;
  try{
    const {img, thumb}=await processFile(next.f);
    const date = next.fromAlbum && next.f.lastModified ? ymd(new Date(next.f.lastModified)) : today();
    openEdit({pages:[{blob:img, thumbBlob:thumb}], date}, true);
  } catch(e){ toast('사진을 읽지 못했어요. 다른 사진으로 해볼까요?'); nextInQueue(); }
}
$('shoot').onclick=()=>$('camera').click();
$('camera').onchange=e=>{ if(e.target.files.length) takeFiles(e.target.files,false); e.target.value=''; };
$('gallery').onchange=e=>{ if(e.target.files.length) takeFiles(e.target.files,true); e.target.value=''; };

/* ---------- 크게 보기: 넘기면 한 작품의 사진들 → 다음 작품 순서 ---------- */
let vIdx=0, vSub=0;
function openViewer(i){ $('viewer').hidden=false; showAt(i, 0); }
function showAt(i, sub){
  if (!shown.length){ $('viewer').hidden=true; return; }
  vIdx=(i+shown.length)%shown.length; const w=shown[vIdx], k=kindOf(w.kind), ph=photosOf(w);
  vSub=clamp(sub||0, 0, ph.length-1);
  $('vImg').src=blobUrl(ph[vSub].imgId);
  $('vTitle').textContent=w.name||k.name;
  const ag=ageLabel(w.date);
  $('vMeta').textContent=`${k.name} · ${w.date.slice(0,4)}년 ${dayLabel(w.date)}${ag?' · '+ag:''}${ph.length>1?` · 사진 ${vSub+1}/${ph.length}`:''} · 작품 ${vIdx+1}/${shown.length}`;
  $('vMemo').textContent=w.memo||'';
  const st=$('vStrip'); st.innerHTML=''; st.hidden=ph.length<2;
  ph.forEach((p,j)=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-current', j===vSub); b.setAttribute('aria-label', `${j+1}번째 사진`);
    b.innerHTML=`<img alt="" src="${blobUrl(p.thumbId)}">`; b.onclick=()=>showAt(vIdx, j); st.appendChild(b); });
  $('vPrev').hidden=$('vNext').hidden = shown.length<2 && ph.length<2;
}
function step(dir){
  const ph=photosOf(shown[vIdx]);
  if (dir>0){ if (vSub<ph.length-1) showAt(vIdx, vSub+1); else showAt(vIdx+1, 0); }
  else { if (vSub>0) showAt(vIdx, vSub-1); else { const j=(vIdx-1+shown.length)%shown.length; showAt(j, photosOf(shown[j]).length-1); } }
}
$('vClose').onclick=()=>{ $('viewer').hidden=true; };
$('vPrev').onclick=()=>step(-1);
$('vNext').onclick=()=>step(1);
$('vEdit').onclick=()=>openEdit(shown[vIdx], false, vSub);
$('vRot').onclick=()=>{ openEdit(shown[vIdx], false, vSub); rotateEditing(); };
$('vDel').onclick=()=>{ $('askBg').hidden=false; };
$('askNo').onclick=()=>{ $('askBg').hidden=true; };
$('askYes').onclick=async()=>{
  const w=shown[vIdx]; $('askBg').hidden=true;
  try{
    await db.collection('works').doc(w.id).delete();
    photosOf(w).forEach(p=>{ assets.delete(p.imgId).catch(()=>{}); assets.delete(p.thumbId).catch(()=>{}); });
    works=works.filter(x=>x.id!==w.id); render(); toast('지웠어요');
    if (shown.length) showAt(Math.min(vIdx, shown.length-1), 0); else $('viewer').hidden=true;
  } catch(e){ toast(errMsg(e), 4000); }
};
let sx=null;
$('vPic').addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; }, {passive:true});
$('vPic').addEventListener('touchend', e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>50) step(dx<0?1:-1); });
document.addEventListener('keydown', e=>{
  if (!$('crop').hidden){ if(e.key==='Escape') cropClose(null); return; }
  if ($('viewer').hidden || !$('editBg').hidden || !$('askBg').hidden) return;
  if (e.key==='ArrowLeft') step(-1); else if (e.key==='ArrowRight') step(1); else if (e.key==='Escape') $('viewer').hidden=true;
});

/* ---------- 탭·메뉴 ---------- */
$('tabDate').onclick=()=>{ view='date'; render(); };
$('tabKind').onclick=()=>{ view='kind'; render(); };
$('menuBtn').onclick=async()=>{
  $('kindList').textContent='지금 종류: '+kinds.map(k=>k.name).join(', ');
  $('birth').value=birth; $('menuBg').hidden=false; $('usage').textContent='';
  if (assets){ try{ const u=(await assets.list()).usage; if(u && u.maxBytes) $('usage').textContent=`저장 공간 ${Math.round(u.bytes/u.maxBytes*100)}% 사용 중 (사진 ${u.files}개 파일 / 최대 ${u.maxFiles}개)`; }catch(e){} }
};
$('menuClose').onclick=()=>{ $('menuBg').hidden=true; };
['menuBg','editBg','askBg'].forEach(id=>$(id).addEventListener('click', e=>{ if(e.target.id!==id) return; if(id==='editBg'){queue=[];closeEdit();} else $(id).hidden=true; }));
$('pickGallery').onclick=()=>{ $('menuBg').hidden=true; $('gallery').click(); };
$('birthHint').onclick=()=>$('menuBtn').click();
$('saveBirth').onclick=async()=>{
  const v=$('birth').value; if(!v){ toast('생일을 골라주세요'); return; }
  try{ await db.doc('settings/profile').set({birth:v}); birth=v; render(); $('menuBg').hidden=true; toast('생일을 저장했어요. 이제 나이가 보여요'); }
  catch(e){ toast(errMsg(e), 4000); }
};
$('addKind').onclick=async()=>{
  const name=$('newKind').value.trim(); if(!name) return;
  if (kinds.some(k=>k.name===name)){ toast('이미 있는 종류예요'); return; }
  const next=kinds.concat({id:'k'+Date.now(), name, color:EXTRA_COLORS[(kinds.length-DEFAULT_KINDS.length)%EXTRA_COLORS.length]});
  try{ await db.doc('settings/kinds').set({list:next}); kinds=next; $('newKind').value='';
    $('kindList').textContent='지금 종류: '+kinds.map(k=>k.name).join(', '); render(); toast(`'${name}' 추가했어요`); }
  catch(e){ toast(errMsg(e), 4000); }
};

/* ---------- 시작 ---------- */
function setWritable(on){
  canWrite=on; $('shoot').hidden=!on; $('vTools').hidden=!on; $('pickGallery').hidden=!on;
  $('addKind').closest('.field').hidden=!on; $('birthField').hidden=!on;
}
setWritable(false); render(); $('count').textContent='불러오는 중…';
(async()=>{
  const use = window.claude && window.claude.use;
  [db, assets] = use ? await Promise.all([window.claude.use('db'), window.claude.use('assets')]) : [null, null];
  if (!db){
    $('count').textContent='';
    $('list').innerHTML='<div class="empty"><div class="big">앨범을 열 수 없어요</div>claude.ai에 로그인한 상태에서 이 링크를 열어주세요.</div>';
    return;
  }
  setWritable(!!assets);
  let first=true;
  const timer=setTimeout(()=>{ if(first){ $('count').textContent='연결이 느려요. 잠시만 기다려 주세요…'; } }, 10000);
  db.collection('works').onSnapshot(snap=>{
    clearTimeout(timer); first=false;
    works=snap.docs.map(d=>({id:d.id, ...d.data()})).filter(w=>w.thumbId && w.date);
    render();
    if (!$('viewer').hidden){ if (vIdx>=shown.length) $('viewer').hidden=true; else showAt(vIdx, vSub); }
  }, ()=>{ clearTimeout(timer); $('count').textContent='앨범을 불러오지 못했어요. 새로고침 해주세요.'; });
  db.doc('settings/profile').onSnapshot(s=>{ const v=s.exists && s.data(); birth=(v && v.birth) || ''; render(); if(!$('viewer').hidden && shown.length) showAt(vIdx, vSub); }, ()=>{});
  db.doc('settings/kinds').onSnapshot(s=>{ const v=s.exists && s.data(); if (v && Array.isArray(v.list) && v.list.length){ kinds=v.list; render(); } }, ()=>{});
})();
})();
</script>
